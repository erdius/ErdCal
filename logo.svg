    <circle cx="394" cy="559" r="22" fill="black"/>
    <rect x="446" y="521" width="76" height="76" rx="16" fill="black"/>
    <circle cx="574" cy="559" r="22" fill="black"/>
    <circle cx="664" cy="559" r="22" fill="black"/>

